# ── CANCEL FLOW ───────────────────────────────────────────────────────────────
- id: btn_cancel_001
  description: "flow_cancel_detect: fb → order select or flow_cancel_fb"
  category: button_routing
  subcategory: cancel
  input:
    message: "fb"
    message_type: option_select
    option_id: fb
    context:
      flow_step: flow_cancel_detect
      turn_count: 2
  expect:
    next_context.flow_step_oneof: [flow_order_select_cancel_fb, flow_cancel_fb]
  tags: [button, cancel, fb]

- id: btn_cancel_002
  description: "flow_cancel_fb: yes (within 30s) → flow_cancel_fb_reason"
  category: button_routing
  subcategory: cancel
  input:
    message: "yes"
    message_type: option_select
    option_id: "yes"
    context:
      flow_step: flow_cancel_fb
      turn_count: 3
  expect:
    next_context.flow_step: flow_cancel_fb_reason
    render_type: options
    options_include_id: [duplicate, add_items, price, wrong, not_avail]
  tags: [button, cancel, fb]

- id: btn_cancel_003
  description: "flow_cancel_fb: no (elapsed) → flow_cancel_elapsed"
  category: button_routing
  subcategory: cancel
  input:
    message: "no"
    message_type: option_select
    option_id: "no"
    context:
      flow_step: flow_cancel_fb
      turn_count: 3
  expect:
    next_context.flow_step: flow_cancel_elapsed
    render_type: options
    message_contains: cancellation time
  tags: [button, cancel, fb]

- id: btn_cancel_004
  description: "flow_cancel_fb_reason: duplicate → flow_cancel_done"
  category: button_routing
  subcategory: cancel
  input:
    message: "duplicate"
    message_type: option_select
    option_id: duplicate
    context:
      flow_step: flow_cancel_fb_reason
      turn_count: 4
  expect:
    next_context.flow_step: flow_cancel_done
    message_contains: successfully cancelled
  tags: [button, cancel, fb]

- id: btn_cancel_005
  description: "flow_cancel_grocery_reason: not_home → flow_cancel_reschedule"
  category: button_routing
  subcategory: cancel
  input:
    message: "not_home"
    message_type: option_select
    option_id: not_home
    context:
      flow_step: flow_cancel_grocery_reason
      turn_count: 4
  expect:
    next_context.flow_step: flow_cancel_reschedule
    options_include_id: [reschedule, cancel]
  tags: [button, cancel, grocery]

