# Button routing single-turn tests
# These test option_select transitions — NLU does NOT run for these.
# We supply a starting flow_step in context and verify the landing step.

# ── MAIN MENU → first step ────────────────────────────────────────────────────
- id: btn_main_001
  description: "Main menu: order_status → flow_order_status"
  category: button_routing
  subcategory: main_menu
  input:
    message: "order_status"
    message_type: option_select
    option_id: order_status
    context:
      flow_step: main
      turn_count: 1
  expect:
    next_context.flow_step: flow_order_status
    render_type: options
    options_include_id: [fb, fashion, electronics]
  tags: [button, main_menu]

