# Multi-turn quality issue flow tests

- id: flow_quality_fb_stale_full
  description: "Quality issue FB — stale food — full upload → ticket confirmation"
  category: flow
  subcategory: quality
  skip_order_api: true
  tags: [flow, quality, fb]
  turns:
    - turn: 1
      description: "User reports quality issue"
      input:
        message: "quality issue with my food"
        message_type: text
      expect:
        nlu_intent: quality_issue
        render_type: options
        next_context.flow_step: flow_quality_detect

    - turn: 2
      description: "Select FB category"
      input:
        message: "fb"
        message_type: option_select
        option_id: fb
      expect:
        next_context.flow_step_oneof: [flow_order_select_quality_fb, flow_quality_fb]

    - turn: 3
      description: "Select stale issue"
      input_requires_step: flow_quality_fb
      input:
        message: "stale"
        message_type: option_select
        option_id: stale
      expect:
        next_context.flow_step: flow_quality_fb_upload
        render_type: upload
        ticket_raised: true
        issue_type: quality_issue_fb
        upload_config.min_photos: 3
        upload_config.video: true

    - turn: 4
      description: "Complete upload"
      input:
        message: "Photos uploaded"
        message_type: upload_complete
        option_id: upload_complete
      expect:
        next_context.flow_step: flow_ticket_confirmed
        render_type: options
        message_contains: ticket has been raised

    - turn: 5
      description: "No agent needed, close"
      input:
        message: "done"
        message_type: option_select
        option_id: done
      expect:
        next_context.flow_step: flow_end

  final_assertions:
    escalate: false


