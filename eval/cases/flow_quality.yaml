- id: flow_quality_electronics_mandatory_escalation
  description: "Quality issue Electronics — triggers mandatory escalation immediately via NLU"
  category: flow
  subcategory: quality
  tags: [flow, quality, electronics, escalation]
  turns:
    - turn: 1
      description: "Text: quality issue with known electronics category"
      input:
        message: "quality issue"
        message_type: text
        context:
          category: electronics
      expect:
        nlu_intent: quality_issue
        escalate: true
        escalate_reason_contains: electronics_mandatory_escalation
        render_type: handover

  final_assertions:
    escalate: true


- id: flow_quality_ticket_then_agent
  description: "Quality FB — upload complete — then request live agent"
  category: flow
  subcategory: quality
  skip_order_api: true
  tags: [flow, quality, fb, escalation]
  turns:
    - turn: 1
      description: "Text: quality issue"
      input:
        message: "stale food"
        message_type: text
      expect:
        nlu_intent: quality_issue
        nlu_source: keyword

    - turn: 2
      description: "Select FB"
      input:
        message: "fb"
        message_type: option_select
        option_id: fb
      expect:
        next_context.flow_step_oneof: [flow_order_select_quality_fb, flow_quality_fb]

    - turn: 3
      description: "Select taste issue"
      input_requires_step: flow_quality_fb
      input:
        message: "taste"
        message_type: option_select
        option_id: taste
      expect:
        render_type: upload

    - turn: 4
      description: "Complete upload"
      input:
        message: "Photos uploaded"
        message_type: upload_complete
        option_id: upload_complete
