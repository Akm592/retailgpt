- id: flow_delivery_directions_text
  description: "Delivery instruction — give directions via text input"
  category: flow
  subcategory: delivery
  tags: [flow, delivery]
  turns:
    - turn: 1
      description: "Text: delivery instructions"
      input:
        message: "I want to give directions to reach me"
        message_type: text
      expect:
        nlu_intent: delivery_instructions

    - turn: 2
      description: "Select: directions"
      input:
        message: "directions"
        message_type: option_select
        option_id: directions
      expect:
        next_context.flow_step: flow_di_directions
        render_type: text_input

    - turn: 3
      description: "Type directions — text_input step now handles message_type=text natively"
      input:
        message: "Take the second left after the main gate, building C, flat 302"
        message_type: text
      expect:
        next_context.flow_step: flow_di_simple
        message_contains: instruction has been noted

    - turn: 4
      description: "Done"
      input:
        message: "done"
        message_type: option_select
        option_id: done
      expect:
        next_context.flow_step: flow_end


