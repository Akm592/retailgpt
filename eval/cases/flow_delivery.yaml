# Multi-turn delivery instructions flow tests

- id: flow_delivery_no_bell
  description: "Delivery instruction — avoid bell — noted and close"
  category: flow
  subcategory: delivery
  tags: [flow, delivery]
  turns:
    - turn: 1
      description: "Text: delivery instructions"
      input:
        message: "I want to give instructions to the delivery partner"
        message_type: text
      expect:
        nlu_intent: delivery_instructions
        render_type: options
        next_context.flow_step: flow_delivery_instructions
        options_count_min: 5

    - turn: 2
      description: "Select: avoid bell"
      input:
        message: "no_bell"
        message_type: option_select
        option_id: no_bell
      expect:
        next_context.flow_step: flow_di_simple
        render_type: options
        message_contains: instruction has been noted

    - turn: 3
      description: "No more instructions — done"
      input:
        message: "done"
        message_type: option_select
        option_id: done
      expect:
        next_context.flow_step: flow_end

  final_assertions:
    escalate: false


