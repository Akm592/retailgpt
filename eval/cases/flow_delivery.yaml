- id: flow_delivery_loop_more_instructions
  description: "Delivery instruction — loop: add two instructions then done"
  category: flow
  subcategory: delivery
  tags: [flow, delivery]
  turns:
    - turn: 1
      description: "Text: delivery instructions"
      input:
        message: "delivery instructions"
        message_type: text
      expect:
        nlu_intent: delivery_instructions

    - turn: 2
      description: "Avoid bell"
      input:
        message: "no_bell"
        message_type: option_select
        option_id: no_bell
      expect:
        next_context.flow_step: flow_di_simple

    - turn: 3
      description: "Add more instructions"
      input:
        message: "more_instr"
        message_type: option_select
        option_id: more_instr
      expect:
        next_context.flow_step: flow_delivery_instructions
        options_count_min: 5

    - turn: 4
      description: "Avoid calling"
      input:
        message: "no_call"
        message_type: option_select
        option_id: no_call
      expect:
        next_context.flow_step: flow_di_simple

    - turn: 5
      description: "Done — no more instructions"
      input:
        message: "done"
        message_type: option_select
        option_id: done
      expect:
        next_context.flow_step: flow_end
