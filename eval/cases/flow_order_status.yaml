- id: flow_delayed_late_then_done
  description: "Delayed order — genuinely late — accept and close"
  category: flow
  subcategory: delayed
  tags: [flow, delayed]
  turns:
    - turn: 1
      description: "Text: order is delayed"
      input:
        message: "My order is delayed"
        message_type: text
      expect:
        nlu_intent: delayed_order
        render_type: options
        next_context.flow_step: flow_delayed
        options_include_id: [ontime, late]

    - turn: 2
      description: "Select: order is genuinely late"
      input:
        message: "late"
        message_type: option_select
        option_id: late
      expect:
        next_context.flow_step: flow_delayed_late
        render_type: options
        options_include_id: [menu, agent, done]

    - turn: 3
      description: "Accept and close"
      input:
        message: "done"
        message_type: option_select
        option_id: done
      expect:
        next_context.flow_step: flow_end

  final_assertions:
    escalate: false


- id: flow_delayed_ontime
  description: "Delayed order — actually still on time"
  category: flow
  subcategory: delayed
  tags: [flow, delayed]
  turns:
    - turn: 1
      description: "Text: delayed order"
      input:
        message: "My order is delayed"
        message_type: text
      expect:
        nlu_intent: delayed_order
        next_context.flow_step: flow_delayed

    - turn: 2
      description: "Select: still showing on time"
      input:
        message: "ontime"
        message_type: option_select
        option_id: ontime
      expect:
        next_context.flow_step: flow_delayed_ontime
        message_contains: on track

    - turn: 3
      description: "Close"
      input:
        message: "done"
        message_type: option_select
        option_id: done
      expect:
        next_context.flow_step: flow_end


- id: flow_delayed_agent_escalation
  description: "Delayed order — late — request agent → escalation"
  category: flow
  subcategory: delayed
  tags: [flow, delayed, escalation]
  turns:
    - turn: 1
      description: "Text: delayed order"
      input:
        message: "My order is delayed"
        message_type: text
      expect:
        nlu_intent: delayed_order

    - turn: 2
      description: "Order is late"
      input:
        message: "late"
        message_type: option_select
        option_id: late
      expect:
        next_context.flow_step: flow_delayed_late

    - turn: 3
      description: "Request agent"
      input:
        message: "agent"
        message_type: option_select
        option_id: agent
      expect:
        next_context.flow_step: flow_delayed_agent
        options_include_id: [ok]

    - turn: 4
      description: "Confirm wait for agent"
      input:
        message: "ok"
        message_type: option_select
        option_id: ok
      expect:
        escalate: true
        escalate_reason_contains: flow_endpoint
        render_type: handover

  final_assertions:
    escalate: true
