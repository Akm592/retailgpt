# Multi-turn order status and delayed order flow tests

- id: flow_status_fb
  description: "Order status — FB — full path to resolution"
  category: flow
  subcategory: order_status
  skip_order_api: true
  tags: [flow, order_status, fb]
  turns:
    - turn: 1
      description: "Text: where is my order"
      input:
        message: "where is my order"
        message_type: text
      expect:
        nlu_intent: track_order
        nlu_source: keyword
        render_type: options
        next_context.flow_step: flow_order_status
        options_include_id: [fb, fashion, electronics]

    - turn: 2
      description: "Select FB category"
      input:
        message: "fb"
        message_type: option_select
        option_id: fb
      expect:
        next_context.flow_step_oneof: [flow_order_select_status_fb, flow_order_status_fb]

    - turn: 3
      description: "Status shown — close"
      input_requires_step: flow_order_status_fb
      input:
        message: "done"
        message_type: option_select
        option_id: done
      expect:
        next_context.flow_step: flow_end

  final_assertions:
    escalate: false


