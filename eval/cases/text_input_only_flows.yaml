# 3. CATEGORY CONTEXT ACCUMULATION — category set on turn 1 persists to turn 2
# ══════════════════════════════════════════════════════════════════════════════

- id: txt_flow_category_accumulation_cancel
  description: "Turn 1 sets category=fb via text; turn 2 text re-routes using stored category"
  category: flow
  subcategory: cancel
  tags: [flow, llm, cancel, text_only]
  turns:
    - turn: 1
      description: "Mention food order → NLU sets category=fb"
      input:
        message: "I want to cancel my food order"
        message_type: text
      expect:
        nlu_intent: cancel_order
        nlu_category: fb
        next_context.category: fb
        next_context.flow_step: flow_cancel_fb

    - turn: 2
      description: "Type cancel again → still at flow_cancel_fb (category:fb still routes here)"
      input:
        message: "please cancel it right now"
        message_type: text
      expect:
        nlu_intent: cancel_order
        next_context.category: fb
        next_context.flow_step: flow_cancel_fb

  final_assertions:
    escalate: false


- id: txt_flow_category_accumulation_quality
  description: "Turn 1 sets category=fb; turn 2 re-triggers quality flow using stored category"
  category: flow
  subcategory: quality
  tags: [flow, llm, quality, text_only]
  turns:
    - turn: 1
      description: "Mention stale food → NLU detects quality_issue + fb"
      input:
        message: "my food was completely stale when it arrived"
        message_type: text
      expect:
        nlu_intent: quality_issue
        nlu_category: fb
        next_context.category: fb
        next_context.flow_step: flow_quality_fb

    - turn: 2
      description: "Rephrase complaint — bot re-routes to same step using stored category"
      input:
        message: "yes the biryani tasted horrible and was cold"
        message_type: text
      expect:
        nlu_intent: quality_issue
        next_context.category: fb
        next_context.flow_step: flow_quality_fb

  final_assertions:
    escalate: false


