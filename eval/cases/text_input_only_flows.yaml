# Text-input-only flow tests
# Every turn uses message_type: text — no button clicks at all.
#
# WHY THIS MATTERS
# ─────────────────────────────────────────────────────────────────────────────
# The INTENT_TO_STEP mapping is category-aware. When the user mentions their
# product category in natural language ("my food order", "fashion shirt"),
# Gemini detects category=fb/fashion/electronics and routes DIRECTLY to the
# category-specific step — skipping the generic category-selector step entirely.
# These tests verify that NLU intelligence, not button clicks, can drive routing.
#
# WHAT CAN BE COMPLETED WITH TEXT-ONLY
# ─────────────────────────────────────────────────────────────────────────────
# ✓ Any flow that ends in escalation (payment, electronics quality, agent request,
#   sentiment overload, bot fallback limit)
# ✓ Single-step flows (modify order, order status with known category)
# ✓ text_input steps (directions, neighbour details) — engine routes via * wildcard
# ✗ Mid-sub-flow choices (e.g. "yes I placed it within 30s" at flow_cancel_fb)
#   cannot advance further with text because NLU re-routes to the same step
# ─────────────────────────────────────────────────────────────────────────────

# ══════════════════════════════════════════════════════════════════════════════
# 1. SMART NLU ROUTING — category detected in text → skip detect step
# ══════════════════════════════════════════════════════════════════════════════

# ── Cancel ────────────────────────────────────────────────────────────────────
- id: txt_route_cancel_fb
  description: "Text: 'cancel my food order' → NLU detects fb → skips detect step, lands on flow_cancel_fb"
  category: nlu
  subcategory: cancel
  input:
    message: "I want to cancel my food order"
    message_type: text
  expect:
    nlu_intent: cancel_order
    nlu_category: fb
    render_type: options
    next_context.flow_step: flow_cancel_fb
    next_context.category: fb
  tags: [llm, english, cancel, text_only]

