# ══════════════════════════════════════════════════════════════════════════════

- id: txt_flow_directions_native_text
  description: "Text-only: delivery instructions then type directions at text_input step"
  category: flow
  subcategory: delivery
  tags: [flow, llm, delivery, text_only]
  turns:
    - turn: 1
      description: "User asks for delivery instructions"
      input:
        message: "I want to give directions to the delivery person"
        message_type: text
      expect:
        nlu_intent: delivery_instructions
        render_type: options
        next_context.flow_step: flow_delivery_instructions
        options_include_id: [no_bell, door, no_call, directions, neighbour]

    - turn: 2
      description: "Now at flow_di_directions via context; type directions as plain text"
      input:
        message: "Take the main entrance, third floor, flat 12B on the left side"
        message_type: text
        context:
          flow_step: flow_di_directions
          turn_count: 2
      expect:
        render_type: options
        next_context.flow_step: flow_di_simple
        message_contains: instruction has been noted

    - turn: 3
      description: "Type 'done' — NLU may not match, but bot re-renders flow_di_simple"
      input:
        message: "that is all thank you"
        message_type: text
      expect:
        escalate: false

  final_assertions:
    escalate: false


