# Escalation rule trigger tests — covers all 6 rules from engine/escalation.py

# ── Rule 1: customer_requested ────────────────────────────────────────────────
- id: esc_customer_requested_001
  description: "Talk to agent keyword → immediate escalation"
  category: escalation
  subcategory: customer_requested
  tags: [escalation, keyword]
  turns:
    - turn: 1
      description: "User types 'talk to agent'"
      input:
        message: "talk to agent"
        message_type: text
      expect:
        nlu_intent: request_agent
        nlu_source: keyword
        escalate: true
        escalate_reason_contains: customer_requested
        render_type: handover

  final_assertions:
    escalate: true


- id: esc_customer_requested_002
  description: "Hinglish agent request → immediate escalation"
  category: escalation
  subcategory: customer_requested
  tags: [escalation, keyword, hinglish]
  turns:
