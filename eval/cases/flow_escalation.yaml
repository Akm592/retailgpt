        nlu_intent: request_agent
        escalate: true
        escalate_reason_contains: customer_requested


# ── Rule 2: bot_fallback (fallback_count >= 3) ────────────────────────────────
- id: esc_bot_fallback_001
  description: "Three consecutive gibberish inputs → bot fallback escalation on turn 3"
  category: escalation
  subcategory: bot_fallback
  tags: [escalation]
  turns:
    - turn: 1
      description: "Gibberish turn 1"
      input:
        message: "xkzqwerty asdfblorp zzzblorp123"
        message_type: text
      expect:
        escalate: false

    - turn: 2
      description: "Gibberish turn 2 — fallback_count should be 2"
      input:
        message: "qwerrtyuio asdf zxcv poiuytre"
        message_type: text
      expect:
        escalate: false

    - turn: 3
      description: "Gibberish turn 3 — fallback_count reaches 3 → escalate"
      input:
        message: "aaaaabbbbbcccccddddd eeeee fffff"
        message_type: text
      expect:
        escalate: true
        escalate_reason_contains: bot_fallback_limit_reached
        render_type: handover

  final_assertions:
    escalate: true


# ── Rule 3: repeat_complaint ──────────────────────────────────────────────────
- id: esc_repeat_complaint_001
  description: "Repeat complaint with open ticket on same order → immediate escalation"
  category: escalation
  subcategory: repeat_complaint
  tags: [escalation]
  customer_id: "cust_repeat_test"
  initial_context:
    order_id: "ord_test_001"
    open_handovers:
      - id: "ticket_abc123"
        order_id: "ord_test_001"
        issue_type: "quality_issue"
        status: "pending_assignment"
  turns:
    - turn: 1
      description: "Quality issue on same order — repeat complaint"
      input:
        message: "quality issue"
        message_type: text
      expect:
        nlu_intent: quality_issue
        escalate: true
        escalate_reason_contains: repeat_complaint
        render_type: handover

  final_assertions:
    escalate: true


