# ── Rule 6: negative_sentiment (negative_turns >= 2) ─────────────────────────
- id: esc_negative_sentiment_001
  description: "Two strongly negative turns → sentiment escalation on turn 2"
  category: escalation
  subcategory: negative_sentiment
  tags: [escalation, llm]
  turns:
    - turn: 1
      description: "First negative message — no escalation yet"
      input:
        message: "This is absolutely terrible service! I am extremely angry and frustrated!"
        message_type: text
      expect:
        escalate: false

    - turn: 2
      description: "Second negative message — negative_turns reaches 2 → escalate"
      input:
        message: "This is completely unacceptable! I am furious! Worst service ever!"
        message_type: text
      expect:
        escalate: true
        escalate_reason_contains: customer_frustrated
        render_type: handover

  final_assertions:
    escalate: true
