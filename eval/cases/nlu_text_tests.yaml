# NLU single-turn text input tests
# Tags: [keyword] = deterministic keyword path, [llm] = Gemini LLM path
# Run with --exclude-tags llm for fast/cheap runs

# ── REQUEST AGENT ────────────────────────────────────────────────────────────
- id: nlu_agent_001
  description: "Talk to agent (keyword)"
  category: nlu
  subcategory: agent
  input:
    message: "talk to agent"
    message_type: text
  expect:
    nlu_intent: request_agent
    nlu_source: keyword
    nlu_confidence_min: 0.90
    escalate: true
    escalate_reason_contains: customer_requested
  tags: [keyword, english, agent]

- id: nlu_agent_002
  description: "Hinglish agent request - koi insaan (keyword)"
  category: nlu
  subcategory: agent
  input:
    message: "koi insaan chahiye mujhe"
    message_type: text
  expect:
    nlu_intent: request_agent
    nlu_source: keyword
    escalate: true
  tags: [keyword, hinglish, agent]

- id: nlu_agent_003
  description: "Human please (keyword)"
  category: nlu
  subcategory: agent
  input:
    message: "human please"
    message_type: text
  expect:
    nlu_intent: request_agent
    nlu_source: keyword
    escalate: true
  tags: [keyword, english, agent]

- id: nlu_agent_004
  description: "Speak to someone (keyword)"
  category: nlu
  subcategory: agent
  input:
    message: "speak to someone"
    message_type: text
  expect:
    nlu_intent: request_agent
